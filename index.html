<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pavitra Classes, Ghoti</title>
    <meta property='og:title' content='Pavitra Classes' />
    <meta property='og:image' content='https://yashkumat.github.io/Pavitra_classes/logo.png' />
    <meta property='og:description' content=' Pavitra Classes, Ghoti. 5th to 10th - CBSE, SSC, ICSE - Maths and Science
            Coaching Center. 9527526222' />
    <meta property='og:url' content='https://yashkumat.github.io/Pavitra_classes/' />
    <meta property='og:image:width' content='400' />
    <meta property='og:image:height' content='400' />
    <!-- TYPE BELOW IS PROBABLY: 'website' or 'article' or look on https://ogp.me/#types -->
    <meta property="og:type" content='website' />
    <link rel="stylesheet" href="https://fxaeberhard.github.io/handdrawn.css/handdrawn.css">
    <meta name="description"
        content="Pavitra Classes, Ghoti. 5th to 10th - CBSE, SSC, ICSE - Maths and Science Coaching Center. 9527526222">
    <meta name="author" content="Yash Kumat">
    <link rel="icon" href="https://yashkumat.github.io/Pavitra_classes/logo.png">
    <meta name="keywords"
        content="Pavitra Classes, Tution, Coaching, 10th CBSE Classes, CBSE classes, SSC classes, Maths class, Science class">
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Poppins:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0b0b0f;
            /* dark base for neon tiles */
            --text: #111;
            --c-blue: #4EC9FF;
            /* primary title tile */
            --c-yellow: #FFD94D;
            --c-pink: #FF77E9;
            --c-orange: #FF8B36;
            --c-purple: #A569FF;
            --c-mint: #7BF0B2;
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Poppins, Arial, sans-serif;
            min-height: 100vh
        }

        .page {
            max-width: 1200px;
            margin: 28px auto;
            padding: 18px;
            color: var(--text)
        }

        /* QUIZ OVERLAY (keeps visible until correct) */
        .quiz-overlay {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 80
        }

        .quiz-card {
            background: linear-gradient(180deg, #081428, #0f1b3a);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 20px;
            border-radius: 14px;
            width: 92%;
            max-width: 520px;
            text-align: center;
            color: #fff
        }

        .toast {
            position: fixed;
            right: 18px;
            top: 18px;
            background: #5be6b4;
            padding: 10px 14px;
            border-radius: 8px;
            color: #052;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            display: none
        }

        .quiz-card h2 {
            margin: 0 0 8px;
            font-size: 20px;
            font-weight: 700
        }

        .question {
            font-size: 26px;
            margin: 10px 0;
            font-weight: 700
        }

        .answer-row {
            display: flex;
            gap: 10px;
            justify-content: center
        }

        .answer-row input {
            padding: 12px 14px;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 18px;
            width: 180px
        }

        .answer-row button {
            padding: 12px 16px;
            border-radius: 10px;
            border: none;
            background: var(--c-blue);
            color: #052;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(78, 201, 255, 0.18)
        }

        /* Mosaic grid */
        .mosaic {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 220px;
            gap: 18px;
            margin-top: 10px
        }

        .tile {
            border-radius: 18px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 14px;
            transform: translateY(12px) scale(0.98);
            opacity: 0
        }

        .tile.big {
            grid-column: span 2;
            grid-row: span 2;
            height: 460px
        }

        .tile .label {
            font-family: 'Luckiest Guy', cursive;
            font-size: 44px;
            color: #fff;
            text-align: center;
            letter-spacing: 2px
        }

        .tile .caption {
            font-weight: 600;
            margin-top: 8px;
            color: rgba(0, 0, 0, 0.65);
            text-align: center;
        }

        .tile .subtitle {
            font-size: 22px;
            font-weight: 700;
            color: #fff
        }

        /* tile colours */
        .t-blue {
            background: linear-gradient(180deg, var(--c-blue), #1bb7ff);
            box-shadow: 0 10px 30px rgba(78, 201, 255, 0.12);
        }

        .t-yellow {
            background: linear-gradient(180deg, var(--c-yellow), #ffd13f);
        }

        .t-pink {
            background: linear-gradient(180deg, var(--c-pink), #ff57d0);
        }

        .t-orange {
            background: linear-gradient(180deg, var(--c-orange), #ff6f3a);
        }

        .t-purple {
            background: linear-gradient(180deg, var(--c-purple), #8e5bff);
        }

        .t-mint {
            background: linear-gradient(180deg, var(--c-mint), #5be6b4);
        }

        .t-contact {
            text-decoration: none;
        }

        #tile4:hover {
            background: #052;
        }

        #tile4:hover .t-cont {
            color: #7BF0B2;
        }

        #tile4:hover .t-desc {
            color: #7BF0B2;
        }

        .t-contact .t-cont {
            font-size: 22px;
            font-weight: 700;
            color: #052;
            animation: heartbeat 1.5s infinite;
        }

        .t-contact .t-desc {
            margin-top: 8px;
            color: #052;
            animation: heartbeat 1.5s infinite;
        }

        /* mascot */
        .mascot {
            width: 120px;
            height: 120px
        }

        .call-btn {
            display: inline-block;
            margin-top: 12px;
            background: var(--c-pink);
            color: #fff;
            padding: 10px 18px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700
        }

        @keyframes heartbeat {
            0% {
                transform: scale(1);
            }

            25% {
                transform: scale(1.2);
                /* Enlarge slightly */
            }

            50% {
                transform: scale(1);
                /* Return to normal */
            }

            75% {
                transform: scale(1.1);
                /* Enlarge slightly less */
            }

            100% {
                transform: scale(1);
            }
        }

        /* responsive */
        @media (max-width:900px) {
            .mosaic {
                grid-template-columns: repeat(2, 1fr);
                grid-auto-rows: 200px
            }

            .tile.big {
                grid-column: span 2;
                height: 420px
            }

            .tile .label {
                font-size: 36px
            }
        }

        @media (max-width:520px) {
            .mosaic {
                grid-template-columns: 1fr;
                grid-auto-rows: 180px
            }

            .tile.big {
                grid-column: span 1;
                height: 380px
            }

            .tile .label {
                font-size: 28px
            }
        }

        /* subtle entrance animation */
        .show .tile {
            animation: tileIn .6s cubic-bezier(.2, .9, .2, 1) forwards
        }

        .show .tile:nth-child(1) {
            animation-delay: 0.05s
        }

        .show .tile:nth-child(2) {
            animation-delay: 0.12s
        }

        .show .tile:nth-child(3) {
            animation-delay: 0.19s
        }

        .show .tile:nth-child(4) {
            animation-delay: 0.26s
        }

        .show .tile:nth-child(5) {
            animation-delay: 0.33s
        }

        .show .tile:nth-child(6) {
            animation-delay: 0.40s
        }

        @keyframes tileIn {
            to {
                transform: translateY(0) scale(1);
                opacity: 1
            }
        }
    </style>
</head>

<body>

    <div class="quiz-overlay" id="quiz">
        <div class="quiz-card" role="dialog" aria-modal="true" aria-labelledby="quiz-title">
            <h2 id="quiz-title">Solve to enter</h2>
            <div class="question" id="question">6 + 3 = ?</div>
            <div class="answer-row">
                <input id="answer" inputmode="numeric" autocomplete="off" placeholder="Type your answer"
                    aria-label="answer" />
                <button id="check">Submit</button>
            </div>
        </div>
    </div>

    <main class="page" id="page">

        <!-- mosaic -->
        <section class="mosaic" id="mosaic">
            <div class="tile t-blue big" id="tile1">
                <div class="label">Pavitra<br>Classes</div>
                <div class="caption">Building strong fundamentals, improving conceptual understanding</div>
            </div>

            <div class="tile t-pink" id="tile2">
                <div style="font-size:22px;font-weight:700;color:#222">Concept-based</div>
                <div style="margin-top:8px;color:#222">Maths and Science Coaching</div>
            </div>

            <div class="tile t-yellow" id="tile3">
                <div style="font-size:22px;font-weight:700;color:#222">Classes</div>
                <div style="margin-top:8px;color:#222">for Std. 7th to 10th</div>
            </div>

            <div class="tile t-orange" id="tile6">
                <div style="font-size:22px;font-weight:700;color:#fff">Fees</div>
                <div style="margin-top:8px;color:#fff">Rs. 2000 monthly</div>
            </div>

            <div class="tile t-purple" id="tile5">
                <div style="font-size:22px;font-weight:700;color:#fff">1 hour daily</div>
                <div style="margin-top:8px;color:rgba(255,255,255,0.9)">Interactive Session</div>
            </div>

            <a href="tel:9527526222" class="tile t-mint t-contact" id="tile4">
                <div class="t-cont">9527526222</div>
                <div class="t-desc">Contact Now</div>
            </a>

        </section>

        <div class="toast" id="toast">Correct — opening site...</div>

    </main>

    <script>
        // quiz
        const quizEl = document.getElementById('quiz');
        const qEl = document.getElementById('question');
        const ansInput = document.getElementById('answer');
        const checkBtn = document.getElementById('check');
        let correctAnswer = null;

        function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min }

        function makeQuestion() {
            const a = randomInt(2, 12);
            const b = randomInt(1, 9);
            const op = Math.random() < 0.6 ? '+' : '-';
            if (op === '+') { correctAnswer = a + b; qEl.textContent = `${a} + ${b} = ?` }
            else { const x = Math.max(a, b); const y = Math.min(a, b); correctAnswer = x - y; qEl.textContent = `${x} - ${y} = ?` }
        }
        makeQuestion();

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        }

        // reveal mosaic + auto scroll and stagger animation
        function reveal() {
            quizEl.style.display = 'none';
            const page = document.getElementById('page');
            page.classList.add('show');
            showToast('Correct answer genius!')
        }

        checkBtn.addEventListener('click', () => {
            const val = ansInput.value.trim();
            if (val === '') { ansInput.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-8px)' }, { transform: 'translateX(8px)' }, { transform: 'translateX(0)' }], { duration: 300 }); return }
            if (Number(val) === correctAnswer) { reveal() } else { ansInput.value = ''; ansInput.focus(); ansInput.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-8px)' }, { transform: 'translateX(8px)' }, { transform: 'translateX(0)' }], { duration: 280 }); showToast('Incorrect') }
        });
        ansInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkBtn.click() }); ansInput.focus();

    </script>
</body>

</html>
